[project]
name = "news-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
tts = ["kokoro>=0.9.4", "numpy>=1.26", "soundfile>=0.12", "google-cloud-texttospeech>=2.16"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
